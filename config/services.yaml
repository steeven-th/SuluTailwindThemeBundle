services:
    _defaults:
        autowire: true
        autoconfigure: true

    # ─── Admin ───────────────────────────────────────────────────────────
    itech_world.sulu_tailwind_theme.admin:
        class: ItechWorld\SuluTailwindThemeBundle\Admin\ThemeAdmin
        arguments:
            - '@sulu_admin.view_builder_factory'
            - '@sulu_security.security_checker'
            - '@itech_world.sulu_tailwind_theme.repository'
            - '@itech_world.sulu_tailwind_theme.google_fonts_catalog'
            - '@itech_world.sulu_tailwind_theme.webspace_theme_repository'
            - '@sulu_core.webspace.webspace_manager'
            - '@itech_world.sulu_tailwind_theme.config_resolver'
            - '%itech_world_sulu_tailwind_theme.article_templates_enabled%'
        tags:
            - { name: 'sulu.admin' }
            - { name: 'sulu.context', context: 'admin' }

    # Adds the live editor button to the page form, a view owned by the page
    # bundle — hence a separate admin from the theme one.
    itech_world.sulu_tailwind_theme.page_live_editor_admin:
        class: ItechWorld\SuluTailwindThemeBundle\Admin\PageLiveEditorAdmin
        tags:
            - { name: 'sulu.admin' }
            - { name: 'sulu.context', context: 'admin' }

    itech_world.sulu_tailwind_theme.webspace_theme_admin:
        class: ItechWorld\SuluTailwindThemeBundle\Admin\WebspaceThemeAdmin
        arguments:
            - '@sulu_admin.view_builder_factory'
            - '@sulu_security.security_checker'
            - '@sulu_core.webspace.webspace_manager'
        tags:
            - { name: 'sulu.admin' }
            - { name: 'sulu.context', context: 'admin' }

    # ─── Controllers ─────────────────────────────────────────────────────
    ItechWorld\SuluTailwindThemeBundle\Controller\Admin\ThemeConfigController:
        autowire: true
        autoconfigure: true
        public: true
        arguments:
            $fieldDescriptorFactory: '@sulu_core.list_builder.field_descriptor_factory'
            $listBuilderFactory: '@sulu_core.doctrine_list_builder_factory'
            $restHelper: '@sulu_core.doctrine_rest_helper'
            $googleFontsCatalog: '@itech_world.sulu_tailwind_theme.google_fonts_catalog'
            $webspaceThemeRepository: '@itech_world.sulu_tailwind_theme.webspace_theme_repository'
        tags:
            - { name: 'controller.service_arguments' }

    ItechWorld\SuluTailwindThemeBundle\Controller\Admin\WebspaceThemeController:
        autowire: true
        autoconfigure: true
        public: true
        tags:
            - { name: 'controller.service_arguments' }

    # Live Theme Editor (SPIKE): standalone full-page editor + live preview loop
    ItechWorld\SuluTailwindThemeBundle\Controller\Admin\LiveThemeEditorController:
        autowire: true
        autoconfigure: true
        public: true
        tags:
            - { name: 'controller.service_arguments' }

    # Article listing page controller (F2): extends Sulu's ContentController to
    # inject the server-side filtered/paginated article list and filter facets.
    ItechWorld\SuluTailwindThemeBundle\Controller\Website\ArticleListingController:
        autowire: true
        autoconfigure: true
        public: true
        arguments:
            # GroupProviderInterface is not autowirable: bind the concrete service
            # (used to expand article types to their template keys).
            $groupProvider: '@sulu_admin.metadata_group_provider'
        tags:
            - { name: 'controller.service_arguments' }

    # ─── Services ────────────────────────────────────────────────────────
    itech_world.sulu_tailwind_theme.palette_generator:
        class: ItechWorld\SuluTailwindThemeBundle\Service\OklchPaletteGenerator

    itech_world.sulu_tailwind_theme.compiler:
        class: ItechWorld\SuluTailwindThemeBundle\Service\ThemeCompiler
        arguments:
            $cssOutputDir: '%itech_world_sulu_tailwind_theme.css_output_dir%'
            $paletteGenerator: '@itech_world.sulu_tailwind_theme.palette_generator'

    # Shares the live editor draft across the admin kernel and the preview
    # sub-kernel, which has no session of its own.
    itech_world.sulu_tailwind_theme.draft_storage:
        class: ItechWorld\SuluTailwindThemeBundle\Service\ThemeDraftStorage
        arguments:
            - '@cache.app'
            - '%kernel.secret%'

    itech_world.sulu_tailwind_theme.provider:
        class: ItechWorld\SuluTailwindThemeBundle\Service\ThemeProvider
        arguments:
            - '@itech_world.sulu_tailwind_theme.repository'
            - '@itech_world.sulu_tailwind_theme.compiler'
            - '@itech_world.sulu_tailwind_theme.webspace_theme_repository'
            - '@?sulu_core.webspace.request_analyzer'
            - '@?request_stack'
            - '@itech_world.sulu_tailwind_theme.draft_storage'

    itech_world.sulu_tailwind_theme.config_resolver:
        class: ItechWorld\SuluTailwindThemeBundle\Service\ThemeConfigResolver
        arguments:
            - '@itech_world.sulu_tailwind_theme.palette_generator'

    itech_world.sulu_tailwind_theme.slug_validator:
        class: ItechWorld\SuluTailwindThemeBundle\Service\SlugValidator

    # Flat form properties ⇄ nested JSON columns. Shared by the theme form
    # controller and anything that needs to build a theme from form data.
    itech_world.sulu_tailwind_theme.form_mapper:
        class: ItechWorld\SuluTailwindThemeBundle\Service\ThemeFormMapper
        arguments:
            - '@itech_world.sulu_tailwind_theme.slug_validator'

    itech_world.sulu_tailwind_theme.block_template_resolver:
        class: ItechWorld\SuluTailwindThemeBundle\Service\BlockTemplateResolver

    itech_world.sulu_tailwind_theme.embed_url_validator:
        class: ItechWorld\SuluTailwindThemeBundle\Service\EmbedUrlValidator
        arguments:
            - '%itech_world_sulu_tailwind_theme.blocks.iframe.allowed_hosts%'

    itech_world.sulu_tailwind_theme.code_block_policy:
        class: ItechWorld\SuluTailwindThemeBundle\Service\CodeBlockPolicy
        arguments:
            - '%itech_world_sulu_tailwind_theme.blocks.code.allow_unsandboxed%'

    # The catalog lets the resolver drop weights a family does not ship: the
    # Google Fonts API rejects the whole request over a single unavailable
    # weight, which would leave the page without any custom font.
    itech_world.sulu_tailwind_theme.google_fonts_resolver:
        class: ItechWorld\SuluTailwindThemeBundle\Service\GoogleFontsResolver
        arguments:
            - '@itech_world.sulu_tailwind_theme.google_fonts_catalog'

    # Server-side backstop: a font can be swapped after its weights were set,
    # and themes also arrive through fixtures, the install command or an import.
    itech_world.sulu_tailwind_theme.typography_weight_validator:
        class: ItechWorld\SuluTailwindThemeBundle\Service\TypographyWeightValidator
        arguments:
            - '@itech_world.sulu_tailwind_theme.google_fonts_catalog'

    # Draws the placeholder images of the demo content at run time, in the
    # colors of the theme: nothing is shipped with the bundle.
    itech_world.sulu_tailwind_theme.demo_image_generator:
        class: ItechWorld\SuluTailwindThemeBundle\Service\DemoImageGenerator

    itech_world.sulu_tailwind_theme.google_fonts_catalog:
        class: ItechWorld\SuluTailwindThemeBundle\Service\GoogleFontsCatalog
        arguments:
            $apiKey: '%itech_world_sulu_tailwind_theme.google_fonts_api_key%'
            $cacheDir: '%itech_world_sulu_tailwind_theme.css_output_dir%'

    # ─── Repositories ─────────────────────────────────────────────────────
    itech_world.sulu_tailwind_theme.repository:
        class: ItechWorld\SuluTailwindThemeBundle\Repository\ThemeConfigRepository
        arguments:
            - '@doctrine'

    itech_world.sulu_tailwind_theme.webspace_theme_repository:
        class: ItechWorld\SuluTailwindThemeBundle\Repository\WebspaceThemeRepository
        arguments:
            - '@doctrine'

    # ─── Twig Extension ──────────────────────────────────────────────────
    itech_world.sulu_tailwind_theme.twig_extension:
        class: ItechWorld\SuluTailwindThemeBundle\Twig\ThemeExtension
        arguments:
            - '@itech_world.sulu_tailwind_theme.provider'
            - '@itech_world.sulu_tailwind_theme.compiler'
            - '@itech_world.sulu_tailwind_theme.google_fonts_resolver'
            - '@itech_world.sulu_tailwind_theme.block_template_resolver'
            - '@itech_world.sulu_tailwind_theme.embed_url_validator'
            - '@itech_world.sulu_tailwind_theme.code_block_policy'
            - '@ItechWorld\SuluTailwindThemeBundle\Service\DemoContentProvider'
            - '@?sulu_core.webspace.request_analyzer'
        tags:
            - { name: 'twig.extension' }

    # ─── Doctrine Listener (auto-registered via #[AsDoctrineListener]) ───
    itech_world.sulu_tailwind_theme.compile_subscriber:
        class: ItechWorld\SuluTailwindThemeBundle\EventSubscriber\ThemeCompileSubscriber
        arguments:
            - '@itech_world.sulu_tailwind_theme.compiler'
            - '@itech_world.sulu_tailwind_theme.webspace_theme_repository'

    # ─── Commands ────────────────────────────────────────────────────────
    ItechWorld\SuluTailwindThemeBundle\Command\ThemeInstallCommand:
        arguments:
            - '@itech_world.sulu_tailwind_theme.repository'
            - '@itech_world.sulu_tailwind_theme.compiler'
            - '@doctrine.orm.entity_manager'
            - '@itech_world.sulu_tailwind_theme.webspace_theme_repository'
        tags:
            - { name: 'console.command' }

    ItechWorld\SuluTailwindThemeBundle\Command\DemoContentCommand:
        arguments:
            - '@messenger.default_bus'
            - '@sulu_core.webspace.webspace_manager'
            - '@sulu_media.media_manager'
            - '@doctrine.orm.entity_manager'
            - '@itech_world.sulu_tailwind_theme.demo_image_generator'
            - '@itech_world.sulu_tailwind_theme.provider'
        tags:
            - { name: 'console.command' }

    ItechWorld\SuluTailwindThemeBundle\Command\ThemeCompileCommand:
        arguments:
            - '@itech_world.sulu_tailwind_theme.repository'
            - '@itech_world.sulu_tailwind_theme.compiler'
        tags:
            - { name: 'console.command' }

    ItechWorld\SuluTailwindThemeBundle\Command\ThemeMigrateWebspacesCommand:
        arguments:
            - '@doctrine.dbal.default_connection'
            - '@sulu_core.webspace.webspace_manager'
            - '@itech_world.sulu_tailwind_theme.webspace_theme_repository'
            - '@itech_world.sulu_tailwind_theme.repository'
            - '@doctrine.orm.entity_manager'
        tags:
            - { name: 'console.command' }

    ItechWorld\SuluTailwindThemeBundle\Command\FontsSyncCommand:
        arguments:
            - '@itech_world.sulu_tailwind_theme.google_fonts_catalog'
        tags:
            - { name: 'console.command' }

    ItechWorld\SuluTailwindThemeBundle\Command\ThemeCheckCommand:
        arguments:
            - '@itech_world.sulu_tailwind_theme.repository'
            - '@itech_world.sulu_tailwind_theme.webspace_theme_repository'
            - '@sulu_core.webspace.webspace_manager'
            - '@itech_world.sulu_tailwind_theme.compiler'
            - '@kernel'
            - '%itech_world_sulu_tailwind_theme.css_output_dir%'
        tags:
            - { name: 'console.command' }

    # ─── Article Twig Extension (loaded when article_templates.enabled) ─
    itech_world.sulu_tailwind_theme.article_twig_extension:
        class: ItechWorld\SuluTailwindThemeBundle\Twig\ArticleExtension
        arguments:
            - '@itech_world.sulu_tailwind_theme.twig_extension'
            - '@?sulu.repository.user'
        tags:
            - { name: 'twig.extension' }

    # ─── Live Theme Editor (SPIKE→feature) ───────────────────────────────
    ItechWorld\SuluTailwindThemeBundle\Service\DemoContentProvider: ~

    # ─── Article discovery services (F2) ─────────────────────────────────
    ItechWorld\SuluTailwindThemeBundle\Service\ArticleSearchService: ~

    ItechWorld\SuluTailwindThemeBundle\Service\ArticleListingResolver: ~

    ItechWorld\SuluTailwindThemeBundle\Service\ArticleFacetsService: ~

    # ─── FQCN Aliases ────────────────────────────────────────────────────
    ItechWorld\SuluTailwindThemeBundle\Service\OklchPaletteGenerator: '@itech_world.sulu_tailwind_theme.palette_generator'
    ItechWorld\SuluTailwindThemeBundle\Service\ThemeCompiler: '@itech_world.sulu_tailwind_theme.compiler'
    ItechWorld\SuluTailwindThemeBundle\Service\ThemeProvider: '@itech_world.sulu_tailwind_theme.provider'
    ItechWorld\SuluTailwindThemeBundle\Service\ThemeDraftStorage: '@itech_world.sulu_tailwind_theme.draft_storage'
    ItechWorld\SuluTailwindThemeBundle\Service\ThemeConfigResolver: '@itech_world.sulu_tailwind_theme.config_resolver'
    ItechWorld\SuluTailwindThemeBundle\Service\SlugValidator: '@itech_world.sulu_tailwind_theme.slug_validator'
    ItechWorld\SuluTailwindThemeBundle\Service\ThemeFormMapper: '@itech_world.sulu_tailwind_theme.form_mapper'
    ItechWorld\SuluTailwindThemeBundle\Service\GoogleFontsResolver: '@itech_world.sulu_tailwind_theme.google_fonts_resolver'
    ItechWorld\SuluTailwindThemeBundle\Service\TypographyWeightValidator: '@itech_world.sulu_tailwind_theme.typography_weight_validator'
    ItechWorld\SuluTailwindThemeBundle\Service\BlockTemplateResolver: '@itech_world.sulu_tailwind_theme.block_template_resolver'
    ItechWorld\SuluTailwindThemeBundle\Service\EmbedUrlValidator: '@itech_world.sulu_tailwind_theme.embed_url_validator'
    ItechWorld\SuluTailwindThemeBundle\Service\CodeBlockPolicy: '@itech_world.sulu_tailwind_theme.code_block_policy'
    ItechWorld\SuluTailwindThemeBundle\Repository\ThemeConfigRepository: '@itech_world.sulu_tailwind_theme.repository'
    ItechWorld\SuluTailwindThemeBundle\Repository\WebspaceThemeRepository: '@itech_world.sulu_tailwind_theme.webspace_theme_repository'
    ItechWorld\SuluTailwindThemeBundle\Twig\ThemeExtension: '@itech_world.sulu_tailwind_theme.twig_extension'
    ItechWorld\SuluTailwindThemeBundle\Twig\ArticleExtension: '@itech_world.sulu_tailwind_theme.article_twig_extension'
    ItechWorld\SuluTailwindThemeBundle\Service\GoogleFontsCatalog: '@itech_world.sulu_tailwind_theme.google_fonts_catalog'
